# air 設定
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -gcflags=\"all=-N -l\" -o ./tmp/main ."
bin = "tmp/main"
full_bin = "dlv --headless=true --listen=:2345 --api-version=2 --accept-multiclient exec --continue ./tmp/main"
include_ext = ["go"]
exclude_dir = ["tmp", "vendor"]
exclude_file = []
include_dir = []
exclude_regex = ["_test\\.go"]
delay = 1000 # ms
stop_on_error = true
send_interrupt = true
kill_delay = 500 # ms
